name: Android-APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk WLAN-Analyzer.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: WLAN-Analyzer-apk
          path: android/WLAN-Analyzer.apk

      - name: GitHub-Release erstellen (nur bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/WLAN-Analyzer.apk
